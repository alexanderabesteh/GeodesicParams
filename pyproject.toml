[project]
name = "orbitronx"
version = "0.2.1"
description = "A python package for determining the astrophysical parameters of a body in Plebański-Demiański spacetimes."
readme = "README.md"
authors = [
  { name = "Alexander Abesteh", email = "alexabesteh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
  "mpmath",
  "sympy",
  "numpy",
  "scipy",
  "jax",
  "torchquad>=0.5.0",
  "torch>=2.10.0",
]

[dependency-groups]
test = [
  "matplotlib",
  "pyqt6",
  "astropy",
  "astroquery",
  "jupyter",
  "vpython",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
